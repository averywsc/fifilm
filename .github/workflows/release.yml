name: Build & Release Windows .exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Read release version and signing mode
        id: meta
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$($pkg.version)" }
          $hasAzure = if ($env:AZURE_SIGNING_ENDPOINT -and $env:AZURE_CLIENT_ID) { "true" } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "has_azure=$hasAzure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag | Azure Trusted Signing enabled: $hasAzure"

      - name: Build Windows Installer and Portable .exe
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:WIN_CSC_LINK) {
            Write-Host "Code signing certificate detected — building signed Windows executables..."
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "true"
            npm run icon:generate
            npm run build:electron
            npx electron-builder --win --publish never --config.win.signAndEditExecutable=true
          } else {
            Write-Host "No WIN_CSC_LINK secret set — building unsigned executables (see docs/SIGNING.md to enable trusted signing)."
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            npm run dist:win
          }

      - name: Sign with Microsoft Azure Trusted Signing
        if: steps.meta.outputs.has_azure == 'true'
        uses: azure/trusted-signing-action@v0.5.7
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fifilm-windows-exe
          path: |
            release/Fifilm-Setup-*.exe
            release/Fifilm-*-Portable.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fifilm ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Fifilm-Setup-*.exe
            release/Fifilm-*-Portable.exe
