name: Build & Release Windows .exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Read release version
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$($pkg.version)" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"

      - name: Build Windows Installer and Portable .exe
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:WIN_CSC_LINK) {
            Write-Host "Code signing certificate detected — building signed Windows executables..."
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "true"
            npm run icon:generate
            npm run build:electron
            npx electron-builder --win --publish never --config.win.signAndEditExecutable=true
          } else {
            Write-Host "No WIN_CSC_LINK secret set — building unsigned executables (see docs/SIGNING.md to enable trusted signing)."
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            npm run dist:win
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fifilm-windows-exe
          path: |
            release/Fifilm-Setup-*.exe
            release/Fifilm-*-Portable.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fifilm ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Fifilm-Setup-*.exe
            release/Fifilm-*-Portable.exe
